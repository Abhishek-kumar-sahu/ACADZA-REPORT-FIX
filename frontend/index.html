<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="acadza-api-base" content="/api/v1">
  <meta name="color-scheme" content="dark">
  <title>Acadza · Report → Fix</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="brand">
        <span class="brand-name">Acadza</span>
        <span class="brand-product">Report → Fix · Faculty</span>
      </div>
      <nav class="nav" aria-label="Sections">
        <a href="#/" data-route="overview">Overview</a>
        <a href="#/queue" data-route="queue">Report Queue <span class="count" id="nav-queue"></span></a>
        <a href="#/review" data-route="review">Faculty Review <span class="count" id="nav-review"></span></a>
        <a href="#/quality" data-route="quality">Quality Audit</a>
        <a href="#/revisions" data-route="revisions">Revision History</a>
        <a href="#/audit" data-route="audit">Audit Logs</a>
        <a href="#/settings" data-route="settings">Settings</a>
      </nav>
      <div class="sidebar-foot" id="engine-note">Engine status loading…</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost menu-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false">Menu</button>
        <span class="grow"></span>
        <a class="pill" href="#/settings" id="api-pill" title="Backend connection"><span class="dot neutral"></span><span>API …</span></a>
        <a class="pill" href="#/settings" id="key-pill" title="Faculty write access"><span class="dot neutral"></span><span>Read-only</span></a>
      </header>
      <main class="page" id="main" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <noscript><p class="page">The Acadza console needs JavaScript.</p></noscript>
</body>
</html>
